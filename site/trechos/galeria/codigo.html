<!-- Janela da foto ampliada -->
<dialog class="lightbox" id="lightbox" aria-label="Foto ampliada">
  <figure class="lightbox-figura">
    <img id="lightbox-img" src="" alt="">
    <figcaption id="lightbox-legenda"></figcaption>
  </figure>
  <button type="button" class="lightbox-btn lightbox-anterior" id="lightbox-anterior" aria-label="Foto anterior">‹</button>
  <button type="button" class="lightbox-btn lightbox-proximo" id="lightbox-proximo" aria-label="Próxima foto">›</button>
  <button type="button" class="lightbox-btn lightbox-fechar" id="lightbox-fechar" aria-label="Fechar">✕</button>
</dialog>
