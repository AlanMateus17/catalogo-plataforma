<!-- YouTube: /embed/ + o código do vídeo (o que vem depois de v= no link) -->
<div class="incorporado">
  <iframe src="https://www.youtube.com/embed/CODIGO-DO-VIDEO" title="Nome do vídeo" loading="lazy"
          allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
</div>

<!-- Google Maps: troque o nome do lugar depois de q= -->
<div class="incorporado">
  <iframe src="https://maps.google.com/maps?q=Barbacena%2C%20MG&amp;z=14&amp;output=embed" title="Mapa de Barbacena" loading="lazy"></iframe>
</div>
