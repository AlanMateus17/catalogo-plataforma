<form class="form-calculo" id="form-imc">
  <div class="campo-calculo">
    <label for="peso">Peso (kg)</label>
    <input type="number" id="peso" min="20" max="300" step="0.1" required>
  </div>
  <div class="campo-calculo">
    <label for="altura">Altura (m)</label>
    <input type="number" id="altura" min="1" max="2.5" step="0.01" required>
  </div>
  <button type="submit" class="botao">Calcular</button>
</form>
<p class="resultado-calculo" id="resultado-imc" role="status"></p>
