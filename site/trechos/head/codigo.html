<!-- Resumo que aparece no Google, embaixo do título.
     Se o seu <head> já tem esta linha, não repita: só troque o texto. -->
<meta name="description" content="Uma frase dizendo do que o site trata.">
<meta name="author" content="Seu Nome">

<!-- Cor da barra do navegador no celular -->
<meta name="theme-color" content="#12324a">

<!-- Ícone da aba (coloque o arquivo na pasta img) -->
<link rel="icon" type="image/png" href="img/favicon.png">

<!-- Como o link aparece quando é compartilhado no WhatsApp e nas redes sociais -->
<meta property="og:title" content="Nome do meu site">
<meta property="og:description" content="Uma frase dizendo do que o site trata.">
<!-- A imagem precisa do endereço COMPLETO do site publicado (caminho curto não funciona no WhatsApp) -->
<meta property="og:image" content="https://seu-usuario.github.io/nome-do-projeto/img/capa.jpg">

<!-- Fonte do Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap">
